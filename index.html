<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script>
    (function () {
      var remote = /^https?:\/\/stgames\.top\/unity\/amongus\//;
      var open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        var args = Array.prototype.slice.call(arguments);
        if (typeof url === "string") args[1] = url.replace(remote, "/");
        return open.apply(this, args);
      };
      var nativeFetch = window.fetch;
      window.fetch = function (input, init) {
        if (typeof input === "string") input = input.replace(remote, "/");
        return nativeFetch.call(this, input, init);
      };
    })();
  </script>
  <script src="js/a.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #000;
    }
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #000;
    }
   </style>
</head>
<body>
    <div class="webgl-content" style="width: 100%; height: 100%;">
        <div id="unityContainer" style="width: 100%; height: 100%;"></div>
    </div>

    <script src="../UnityProgress.js"></script>
    <script src="../UnityLoader.js"></script>

	<script>
        var unityInstance = UnityLoader.instantiate("unityContainer", "Build/Game.json", {onProgress: UnityProgress});
    </script>
</body>
</html>
